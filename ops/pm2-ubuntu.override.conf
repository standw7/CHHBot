[Service]
Restart=always
RestartSec=5
# The pm2 CLI spawns a new daemon whenever it can't reach one, and a daemon
# spawned from ExecStop escapes the cgroup. Never call the CLI on stop; let
# systemd SIGTERM the cgroup instead.
ExecStop=
# Before resurrecting, kill anything PM2-related that escaped the cgroup
# (orphaned daemon or bot) and clear stale sockets so the fresh daemon is ours.
ExecStartPre=-/usr/bin/pkill -u ubuntu -f "PM2 v.*God Daemon"
ExecStartPre=-/usr/bin/pkill -u ubuntu -f "node /home/ubuntu/CHHBot/dist/index.js"
ExecStartPre=/bin/sleep 2
ExecStartPre=/bin/rm -f /home/ubuntu/.pm2/rpc.sock /home/ubuntu/.pm2/pub.sock /home/ubuntu/.pm2/pm2.pid
TimeoutStopSec=20
